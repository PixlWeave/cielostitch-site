<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Solar mosaic preview — a grid of solar image panels stitched together">
  <defs>
    <radialGradient id="sun-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff7c0"/>
      <stop offset="30%"  stop-color="#ffd966"/>
      <stop offset="65%"  stop-color="#f4831f"/>
      <stop offset="100%" stop-color="#c0390b"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f4831f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a1a"  stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tile-a" cx="40%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#e05c00"/>
    </radialGradient>
    <radialGradient id="tile-b" cx="60%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#c0390b"/>
    </radialGradient>
    <radialGradient id="tile-c" cx="45%" cy="55%" r="58%">
      <stop offset="0%"   stop-color="#fff0a0"/>
      <stop offset="100%" stop-color="#d04800"/>
    </radialGradient>
    <radialGradient id="tile-d" cx="55%" cy="45%" r="62%">
      <stop offset="0%"   stop-color="#ffdf70"/>
      <stop offset="100%" stop-color="#b03200"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mosaic-clip">
      <rect x="120" y="40" width="480" height="400" rx="12"/>
    </clipPath>
    <!-- tile clip paths (each 118×98 with 2px gap) -->
    <clipPath id="c00"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c10"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c20"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c30"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c01"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c11"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c21"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c31"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c02"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c12"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c22"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c32"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c03"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c13"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c23"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
    <clipPath id="c33"><rect x="0"   y="0"   width="118" height="98" rx="4"/></clipPath>
  </defs>

  <!-- page background -->
  <rect width="720" height="480" fill="#0a0a1a"/>

  <!-- ambient glow behind mosaic -->
  <ellipse cx="360" cy="240" rx="280" ry="230" fill="url(#sun-glow)" filter="url(#blur-sm)"/>

  <!-- mosaic frame -->
  <rect x="116" y="36" width="488" height="408" rx="14" fill="#1a1a2e" stroke="#f4831f" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 4×4 grid of solar tiles; each tile is 118×98, gap 2px, origin (120,40) -->
  <!-- Row 0 -->
  <g transform="translate(120,40)">
    <g clip-path="url(#c00)"><circle cx="59" cy="49" r="80" fill="url(#tile-c)"/><circle cx="30" cy="20" r="18" fill="#fff8d0" opacity=".25"/><circle cx="80" cy="70" r="10" fill="#7a1500" opacity=".5"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(240,40)">
    <g clip-path="url(#c10)"><circle cx="59" cy="49" r="80" fill="url(#tile-a)"/><circle cx="70" cy="30" r="14" fill="#fff0b0" opacity=".3"/><circle cx="40" cy="65" r="8"  fill="#6b1000" opacity=".45"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(360,40)">
    <g clip-path="url(#c20)"><circle cx="59" cy="49" r="80" fill="url(#tile-b)"/><circle cx="50" cy="25" r="20" fill="#fff5c0" opacity=".28"/><circle cx="75" cy="60" r="12" fill="#8c1800" opacity=".5"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(480,40)">
    <g clip-path="url(#c30)"><circle cx="59" cy="49" r="80" fill="url(#tile-d)"/><circle cx="35" cy="35" r="16" fill="#ffe890" opacity=".22"/><circle cx="68" cy="72" r="9"  fill="#751200" opacity=".4"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>

  <!-- Row 1 -->
  <g transform="translate(120,140)">
    <g clip-path="url(#c01)"><circle cx="59" cy="49" r="80" fill="url(#tile-b)"/><circle cx="45" cy="55" r="22" fill="#fff0a0" opacity=".26"/><circle cx="82" cy="35" r="11" fill="#7f1400" opacity=".48"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(240,140)">
    <!-- center-left bright tile -->
    <g clip-path="url(#c11)"><circle cx="59" cy="49" r="80" fill="url(#sun-core)"/><circle cx="55" cy="45" r="30" fill="#fffbe0" opacity=".5"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(360,140)">
    <!-- center-right bright tile -->
    <g clip-path="url(#c21)"><circle cx="59" cy="49" r="80" fill="url(#sun-core)"/><circle cx="65" cy="52" r="28" fill="#fffbe0" opacity=".5"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(480,140)">
    <g clip-path="url(#c31)"><circle cx="59" cy="49" r="80" fill="url(#tile-a)"/><circle cx="40" cy="60" r="18" fill="#ffe870" opacity=".24"/><circle cx="72" cy="30" r="10" fill="#801500" opacity=".45"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(120,240)">
    <g clip-path="url(#c02)"><circle cx="59" cy="49" r="80" fill="url(#tile-a)"/><circle cx="60" cy="40" r="20" fill="#fff5b0" opacity=".3"/><circle cx="30" cy="70" r="13" fill="#6f1100" opacity=".44"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(240,240)">
    <!-- center-left bright tile -->
    <g clip-path="url(#c12)"><circle cx="59" cy="49" r="80" fill="url(#sun-core)"/><circle cx="52" cy="54" r="32" fill="#fffbe0" opacity=".48"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(360,240)">
    <!-- center-right bright tile -->
    <g clip-path="url(#c22)"><circle cx="59" cy="49" r="80" fill="url(#sun-core)"/><circle cx="66" cy="46" r="28" fill="#fffbe0" opacity=".48"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(480,240)">
    <g clip-path="url(#c32)"><circle cx="59" cy="49" r="80" fill="url(#tile-c)"/><circle cx="48" cy="38" r="17" fill="#ffe880" opacity=".22"/><circle cx="73" cy="65" r="11" fill="#8a1600" opacity=".46"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>

  <!-- Row 3 -->
  <g transform="translate(120,340)">
    <g clip-path="url(#c03)"><circle cx="59" cy="49" r="80" fill="url(#tile-d)"/><circle cx="38" cy="42" r="19" fill="#ffe070" opacity=".2"/><circle cx="77" cy="68" r="10" fill="#761300" opacity=".42"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(240,340)">
    <g clip-path="url(#c13)"><circle cx="59" cy="49" r="80" fill="url(#tile-c)"/><circle cx="55" cy="65" r="16" fill="#fff0a0" opacity=".25"/><circle cx="35" cy="30" r="12" fill="#7e1400" opacity=".47"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(360,340)">
    <g clip-path="url(#c23)"><circle cx="59" cy="49" r="80" fill="url(#tile-b)"/><circle cx="62" cy="35" r="21" fill="#ffe890" opacity=".27"/><circle cx="42" cy="68" r="9"  fill="#861600" opacity=".44"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>
  <g transform="translate(480,340)">
    <g clip-path="url(#c33)"><circle cx="59" cy="49" r="80" fill="url(#tile-a)"/><circle cx="44" cy="50" r="23" fill="#fff0b0" opacity=".23"/><circle cx="70" cy="25" r="14" fill="#791400" opacity=".4"/></g>
    <rect x="0" y="0" width="118" height="98" rx="4" fill="none" stroke="#0a0a1a" stroke-width="2"/>
  </g>

  <!-- seam lines (grid) drawn on top for stitching effect -->
  <g stroke="#0a0a1a" stroke-width="2" opacity="0.9" clip-path="url(#mosaic-clip)">
    <line x1="238" y1="40"  x2="238" y2="440"/>
    <line x1="358" y1="40"  x2="358" y2="440"/>
    <line x1="478" y1="40"  x2="478" y2="440"/>
    <line x1="120" y1="138" x2="600" y2="138"/>
    <line x1="120" y1="238" x2="600" y2="238"/>
    <line x1="120" y1="338" x2="600" y2="338"/>
  </g>

  <!-- subtle vignette overlay -->
  <rect x="116" y="36" width="488" height="408" rx="14"
        fill="url(#sun-glow)" opacity="0.12"/>

  <!-- outer frame glow -->
  <rect x="116" y="36" width="488" height="408" rx="14"
        fill="none" stroke="#f4831f" stroke-width="2" stroke-opacity="0.6"/>

  <!-- label -->
  <text x="360" y="464" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="11" fill="#f4831f" opacity="0.7" letter-spacing="2">
    SOLAR MOSAIC PREVIEW
  </text>
</svg>
