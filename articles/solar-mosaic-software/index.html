<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | CieloStitch</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <script defer src="/scripts/main.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/purify.min.js"></script>
    <script defer src="/scripts/post.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/index.html" aria-label="CieloStitch home">
          <img src="/assets/cielostitch_256.png" alt="" width="48" height="48" />
          <span class="brand-copy"><strong>CieloStitch</strong><span>Articles</span></span>
        </a>
        <div class="header-actions">
          <a class="button button--ghost" href="/index.html">Home</a>
          <a class="button button--ghost" href="/help/index.html">Help</a>
          <a class="button button--ghost" href="/articles/index.html">Articles</a>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
            aria-pressed="false"
          >
            <span class="theme-toggle__icon" aria-hidden="true">◐</span>
            <span>Theme</span>
          </button>
        </div>
      </header>

      <main class="section">
        <article class="prose">
          <div id="post-body"></div>
        </article>
      </main>

      <footer class="site-footer section">
        <a href="/articles/index.html">← Back to Articles</a>
      </footer>
    </div>
  </body>
  </html>
